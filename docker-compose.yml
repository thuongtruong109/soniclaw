services:
  soniclaw:
    image: thuongtruong1009/soniclaw:latest
    build: .
    ports:
      - "18789:18789"
      # OpenAI OAuth callbacks are hardcoded to http://localhost:8080 and
      # http://localhost:1455, and OpenClaw binds them on loopback *inside* the
      # container. These published ports are fed by the oauth-forward sidecar
      # below, which republishes those loopback listeners on the container
      # network. See scripts/oauth-callback-forward.mjs.
      - "8080:18080" # Sign in with ChatGPT (Beta)
      - "1455:11455" # Codex login (browser)
    restart: unless-stopped
    stdin_open: true
    tty: true
    # Reap the child processes the Gateway spawns (agents, workers, browser bridge).
    init: true
    # Let SQLite close cleanly instead of being killed mid-checkpoint.
    stop_grace_period: 30s
    volumes:
      # OpenClaw writes its config/state files with an atomic temp-file + rename,
      # then fstat()s the still-open handle. That fails with ENOENT on Windows
      # bind mounts (Docker Desktop / grpcfuse), which breaks `openclaw doctor --fix`
      # and the Gateway never starts. Keep the live state on a real Linux volume.
      - openclaw-data:/root/.openclaw
      # The repo copy of .openclaw is only a seed: it is imported into the volume
      # the first time the container starts (see entrypoint.sh).
      - ./.openclaw:/seed:ro
    environment:
      - NODE_ENV=production
      - TZ=Asia/Ho_Chi_Minh
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Gateway boot (doctor + migrations + first ready) takes ~30-60s.
      start_period: 90s

  # Bridges the OAuth loopback listeners (127.0.0.1:8080 and 127.0.0.1:1455
  # inside the gateway) to the published host ports above, so the Windows
  # browser can finish "Sign in with ChatGPT (Beta)" and "Codex login (browser)".
  oauth-forward:
    image: thuongtruong1009/soniclaw:latest
    # Same network namespace as the gateway: 127.0.0.1 is shared.
    network_mode: "service:soniclaw"
    entrypoint: ["node", "/oauth-callback-forward.mjs"]
    restart: unless-stopped
    init: true
    mem_limit: 64m
    volumes:
      - ./scripts/oauth-callback-forward.mjs:/oauth-callback-forward.mjs:ro

volumes:
  openclaw-data:
