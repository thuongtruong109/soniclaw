services:
  soniclaw:
    image: thuongtruong1009/soniclaw:latest
    container_name: soniclaw
    build: .
    ports:
      - "18789:18789"
    restart: unless-stopped
    stdin_open: true
    tty: true
    volumes:
      - openclaw-data:/root/.openclaw
      - ./.openclaw:/seed:ro
    environment:
      - NODE_ENV=production
      - TZ=Asia/Ho_Chi_Minh
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  openclaw-data:
